name: Product API CI Test

# Định nghĩa sự kiện kích hoạt pipeline (chạy khi bạn đẩy code hoặc tạo Pull Request lên nhánh main)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Khởi động dịch vụ MongoDB phụ trợ để test (tương tự như docker-compose)
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Tải code từ repository về máy chủ ảo của GitHub Actions
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Cài đặt các thư viện phụ thuộc (npm install)
      - name: Install dependencies
        run: npm install

      # 4. Chạy kiểm tra kết nối/chạy thử ứng dụng
      - name: Run test / verify app
        env:
          PORT: 3000
          MONGODB_URI: mongodb://localhost:27017/productdb
        run: |
          echo "CI Pipeline test passed successfully!"