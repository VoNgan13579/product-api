version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: production-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - prod-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-api-prod:
    image: vongan13579/product-api:latest
    container_name: product-api-prod-container
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://production-mongodb:27017/productdb
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - prod-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_prod_data:

networks:
  prod-network:
    driver: bridge
    